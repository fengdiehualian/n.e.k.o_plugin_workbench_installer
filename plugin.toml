[plugin]
id = "workbench_installer"
name = "Agent工作台安装器"
version = "0.1.1"
type = "plugin"
description = "在猫娘计划(N.E.K.O.)里一键安装「N.E.K.O. 插件工坊」Agent 工作台:在线下载官方便携包或使用本地 zip,解压安装、创建桌面快捷方式并启动;随时查看安装与运行状态。对猫娘说「安装工作台」「启动工作台」即可使用。"
short_description = "Install & launch the N.E.K.O. Plugin Workbench (Agent workbench) from inside N.E.K.O."
keywords = ["安装", "工作台", "工坊", "插件工坊", "Agent工作台", "workbench", "installer", "安装器", "启动工作台", "重装"]
entry = "plugin.plugins.workbench_installer:WorkbenchInstallerPlugin"

[plugin.author]
name = "fengdiehualian"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
timeout = 60
startup_failure = "warn"

[workbench_installer]
# 默认安装目录(留空 = %LOCALAPPDATA%\Programs\NEKOWorkshop)
target = ""
# 便携包下载地址(留空 = 官方 GitHub Release 最新便携包)
url = ""
